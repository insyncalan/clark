# Mergify merge queue test (ticket clark-plan#1581, Alan 24-11). One queue rule; a PR joins the queue when it carries the label `queue`
# and the required checks are green. Merging stays as before for every PR without the label.
queue_rules:
  - name: default
    queue_conditions:
      - label = queue
      - check-success = Tests passed
      - check-success = bifrost-closes-guard
      - check-success = bifrost-point-map
      - check-success = bifrost-test-exists
    merge_conditions:
      - check-success = Tests passed
      - check-success = bifrost-closes-guard
      - check-success = bifrost-point-map
      - check-success = bifrost-test-exists
    merge_method: squash
    batch_size: 3
    batch_max_wait_time: 1 minute
