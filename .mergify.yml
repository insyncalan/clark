# Mergify merge queue test (ticket 1581, 24-11). One queue rule: a PR joins the queue when it carries the label `queue`
# and the required checks are green. Every PR without the label merges as before.
queue_rules:
  - name: default
    queue_conditions:
      - label = queue
      - base = main
      - -draft
      - check-success = Tests passed
      - check-success = bifrost-closes-guard
      - check-success = bifrost-point-map
      - check-success = bifrost-test-exists
    merge_conditions:
      - check-success = Tests passed
      - check-success = bifrost-closes-guard
      - check-success = bifrost-point-map
      - check-success = bifrost-test-exists
    merge_method: merge
    batch_size: 3
    batch_max_wait_time: 1 minute

# Row 1581 follow-up: the label alone enqueued nothing. This rule queues a PR that carries `queue`;
# the queue_conditions above still decide when it may join.
pull_request_rules:
  - name: Queue PRs labelled queue
    conditions:
      - label = queue
      - base = main
      - -draft
      - -closed
    actions:
      queue:
        name: default
