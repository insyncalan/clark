# Windows override for docker/compose.yaml (issue 635). On Windows the data is kept in a Docker named volume, not in the Mac path
# (~/Library/Application Support/clark) that compose.yaml names. In the unzipped clark folder, in PowerShell or Command Prompt:
#   docker compose -f docker/compose.yaml -f docker/compose.windows.yaml up -d        then open http://127.0.0.1:8766
#   docker compose -f docker/compose.yaml -f docker/compose.windows.yaml down         to stop it (the data stays in the volume)
# The volume is called clark-data. It lives inside Docker, not in a Windows folder, so OneDrive cannot reach it. Back up from
# clark's own backups, which are copied to a Windows folder. Do not use "down -v": that deletes the volume and the data in it.
# The /data mount here replaces the one in compose.yaml (the two are matched by their target, /data).
services:
  clark:
    volumes:
      - type: volume
        source: clark-data
        target: /data
    # A new named volume belongs to root, so the container user (UID and GID 1000 in compose.yaml) could not write it. Root owns the
    # volume and every capability is still dropped by compose.yaml, so this does not widen what the container can do on this computer.
    user: "0:0"
    environment:
      # Names where the data is kept, for the doctor's Docker check and for the start-up refusals; there is no Windows folder to read.
      CLARK_DATA_SOURCE: "docker-volume:clark-data"
volumes:
  clark-data:
