# Start clark with Docker instead of a Terminal window (item 427). In the unzipped clark folder:
#   bash docker/start.command        checks the data folder is not in OneDrive, Dropbox, iCloud Drive or Google Drive, then does the next line
#   docker compose -f docker/compose.yaml up -d        then open http://localhost:8766
#   docker compose -f docker/compose.yaml down         to stop it
# The data is kept in ~/Library/Application Support/clark, the same place clark.command uses, not in this folder. To use another data
# folder, name it (a full path, in quotes) in CLARK_DATA_DIR; to use another port on this computer, CLARK_PORT:
#   CLARK_DATA_DIR="/full/path/to/the/folder" docker compose -f docker/compose.yaml up -d
#   CLARK_PORT=8780 docker compose -f docker/compose.yaml up -d        then open http://localhost:8780
# Only a stock Python image runs here: nothing of clark is built into it. clark's code stays in this folder on
# your computer, which is shared into the container read-only as /clark (the container's working directory). The data is mounted
# separately, read-write, as /data (clark is started with --data /data). It is NOT in this folder, so swapping this folder for a
# newer download cannot lose it.
# The port is published to 127.0.0.1 ONLY. Without the "127.0.0.1:" in front, anyone on your network could reach clark.
name: clark
services:
  clark:
    image: python:3.12.12-slim-bookworm
    working_dir: /clark
    # The same start as the Terminal route's: python3 -m clark checks the pages (and in a checkout would build them), then serves.
    # First the data check (#633): it reads the data's version, takes a pre-update copy when this clark is newer than the data, and refuses
    # (exit 2, "start from the newer clark folder. Nothing was changed.") when the data is newer than this clark. Only then the server.
    # A refusal ends the container with exit 0 (a restart policy of on-failure does not restart that), so it neither loops nor takes a new
    # pre-update copy on each loop; the words stay in "docker compose logs". The server itself exiting with an error is restarted.
    command: ["sh", "-c", "python3 -m clark check-data --data /data || { echo 'clark did not start. The words above say why.' >&2; exit 0; }; exec python3 -m clark --data /data --port 8766"]
    ports:
      - "127.0.0.1:${CLARK_PORT:-8766}:8766"
    # clark's code is shared in read-only, so the container cannot change it; only the data folder can be written. The data folder
    # is mounted at /data, NOT inside /clark: Docker cannot make a mountpoint inside a read-only share, so a /clark/data target
    # failed on a first start with CLARK_DATA_DIR named (no data folder yet beside this file).
    # The download holds its built pages. A source checkout must build them first on the computer: python3 dev/tools/build_page.py
    volumes:
      - type: bind
        source: ..
        target: /clark
        read_only: true
      - type: bind
        source: ${CLARK_DATA_DIR:-${HOME}/Library/Application Support/clark}
        target: /data
        bind:
          create_host_path: true
    # Not root: the container writes the data folder as an ordinary user. UID and GID are read when they are exported (Linux);
    # on a Mac or Windows, Docker Desktop writes the shared folder as the person signed in, whatever the number here.
    user: "${UID:-1000}:${GID:-1000}"
    # CLARK_CONTAINER=1 lets clark listen inside the container and trust the one peer the published port arrives from
    # (src/clark/server.py, container_mode). CLARK_DATA_SOURCE names this computer's data folder, so clark can refuse it
    # when it is inside OneDrive (from inside the container OneDrive cannot be seen); it is the same folder as the data mount above.
    # CLARK_PUBLISHED_PORT is the port you open (only so the start-up line names it).
    # CLARK_PORT here is the port inside the container, always 8766; the CLARK_PORT you set only changes the published one above.
    environment:
      CLARK_CONTAINER: "1"
      CLARK_PORT: "8766"
      CLARK_PUBLISHED_PORT: "${CLARK_PORT:-8766}"
      CLARK_DATA_SOURCE: "${CLARK_DATA_DIR:-${HOME}/Library/Application Support/clark}"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8766/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Restarted if the server stops with an error, and comes back with Docker after a restart of the computer while it was running;
    # docker compose down (or stop) still stops it. A data check that refuses ends with exit 0, so it is not restarted.
    restart: on-failure
