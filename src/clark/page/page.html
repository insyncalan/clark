:root {
  --brand-blue: #3B5BDB; --brand-blue-strong: #2F4AC0; --brand-blue-tint: #EDF1FF; --brand-navy: #14233A; --brand-ink: #18232B; --brand-cyan: #4FD1E8; --brand-charcoal: #4A5058;
  --white: #fff; --grey-50: #F3F5F8; --grey-100: #E9EBEE; --grey-200: #E0E2E5; --grey-300: #D3D5D8; --grey-500: #9A9EA3; --grey-700: #5A6270;
  --status-green: #0F7B5F; --status-amber: #B26B0C; --status-red: #BE3A2B; --status-blue: #3B5BDB; --status-grey: #9A9EA3;
  --status-green-tint: #DCEFE9; --status-amber-tint: #F7EBDA; --status-red-tint: #F6E1DE;
  --status-green-text: #0B654E; --status-amber-text: #8A5200; --status-red-text: #A3301F; --status-blue-text: #2A4FE0;
  --text: var(--brand-ink); --text-muted: var(--grey-700); --border: var(--grey-300);
  --font: "Readex Pro", Arial, "Helvetica Neue", sans-serif;
  --radius-sm: 4px; --radius: 6px; --radius-lg: 8px;
  --shadow: 0 1px 2px rgba(19, 35, 42, .08), 0 2px 8px rgba(19, 35, 42, .06);
  --ease-out: cubic-bezier(.25, 1, .5, 1); --ease-enter: cubic-bezier(.16, 1, .3, 1); --ease-exit: cubic-bezier(.7, 0, .84, 0); --ease-toggle: cubic-bezier(.65, 0, .35, 1);
  --dur-instant: 120ms; --dur-state: 220ms; --dur-layout: 380ms; --dur-enter: 700ms;
  --image-cover: none; --image-fade: linear-gradient(90deg, transparent 0%, #000 45%);
  --topbar: 56px; --logo-icon: inline-block;      
  
  --bg: var(--grey-50); --black: #000; --text-on-brand: #fff; --surface-muted: var(--grey-50); --link: var(--status-blue-text); --focus: var(--brand-cyan);
  --data-1: #3B5BDB; --data-2: #0F7B5F; --data-3: #B26B0C; --data-4: #BE3A2B; --data-5: #7048B6; --data-6: #2B8AA0;
  --size-body: 15px; --size-caption: 12px; --size-small: 13px; --size-h3: 16px; --size-h2: 20px; --size-h1: 26px; --size-display: 34px; --leading: 1.5;
  --weight-light: 300; --weight-regular: 400; --weight-medium: 500; --weight-semibold: 600; --tracking-caps: .06em;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;
  --max-width: 1280px; --radius-pill: 999px; --stagger: 60ms;
  --surface: #fff; --heading: var(--brand-navy); --flash: #FFF5D6;
  
  --profile-bg: var(--brand-charcoal); --profile-fg: var(--white); --profile-ring: var(--grey-500); --profile-size: 32px;
}

:root[data-theme=dark] {
  color-scheme: dark;
  --surface: #17212C; --grey-50: #0E151D; --grey-100: #1E2935; --grey-200: #2A3643; --grey-300: #3A4755; --grey-500: #7C8794; --grey-700: #A9B2BD;
  --brand-ink: #E7EBF0; --heading: #DDE5F2; --brand-blue: #3962FE; --brand-blue-strong: #7590FF; --brand-blue-tint: #1F2C52;
  --status-green: #2FB38F; --status-amber: #D98E2B; --status-red: #E2685A; --status-blue: #3962FE; --status-grey: #7C8794;
  --status-green-tint: #12352D; --status-amber-tint: #3A2C16; --status-red-tint: #3D1F1B;
  --status-green-text: #5CCBA9; --status-amber-text: #E6AA55; --status-red-text: #F08A7C; --status-blue-text: #8FA6FF;
  --data-1: #6F8CF7; --data-2: #3FBF9B; --data-3: #E0A04A; --data-4: #E97C6E; --data-5: #A585E0; --data-6: #55B8CC;
  --flash: #4A3F1A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 2px 8px rgba(0, 0, 0, .3);
}
@media (prefers-color-scheme: dark) {
  :root[data-theme=auto] {
    color-scheme: dark;
    --surface: #17212C; --grey-50: #0E151D; --grey-100: #1E2935; --grey-200: #2A3643; --grey-300: #3A4755; --grey-500: #7C8794; --grey-700: #A9B2BD;
    --brand-ink: #E7EBF0; --heading: #DDE5F2; --brand-blue: #3962FE; --brand-blue-strong: #7590FF; --brand-blue-tint: #1F2C52;
    --status-green: #2FB38F; --status-amber: #D98E2B; --status-red: #E2685A; --status-blue: #3962FE; --status-grey: #7C8794;
    --status-green-tint: #12352D; --status-amber-tint: #3A2C16; --status-red-tint: #3D1F1B;
    --status-green-text: #5CCBA9; --status-amber-text: #E6AA55; --status-red-text: #F08A7C; --status-blue-text: #8FA6FF;
    --data-1: #6F8CF7; --data-2: #3FBF9B; --data-3: #E0A04A; --data-4: #E97C6E; --data-5: #A585E0; --data-6: #55B8CC;
    --flash: #4A3F1A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 2px 8px rgba(0, 0, 0, .3);
  }
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--grey-50); color: var(--text); font: var(--weight-light) var(--size-body)/var(--leading) var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: var(--status-blue-text); }
