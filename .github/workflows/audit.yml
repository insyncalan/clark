# The code audit (#1382, Alan 19-11-2026): pip-audit on the vendored packages, bandit, ruff and mypy on src/clark. REPORT ONLY: no step can fail
# the run, it is not a required check, and it never blocks a pull request. The output is kept as a build artifact for 30 days.
# Runs by hand and every Sunday 03:00 Dubai (no push trigger). Baseline 19-11: pip-audit clean; bandit 3 high,
# 45 medium, 23 low; mypy 45 errors in 18 files. Once the baseline is cleared (the v1.4 Tech Debt items), the job can start failing on NEW high findings.
# Safety: read-only permissions, no secrets, no pull_request_target, every action pinned to a full commit SHA, tool versions pinned.
name: Audit
on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 6"      # Sunday 03:00 Dubai (Saturday 23:00 UTC), on main only

permissions:
  contents: read

concurrency:
  group: audit-${{ github.sha }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit (report only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the audit tools (pinned)
        run: python -m pip install bandit==1.9.4 mypy==2.4.1 ruff==0.17.0 pip-audit==2.10.1
      - name: Run the audits (each one reports, none fails the run)
        run: |
          mkdir -p audit-out
          pip-audit -r requirements-audit.txt > audit-out/pip-audit.txt 2>&1 || true
          bandit -r src/clark -q -f txt -o audit-out/bandit.txt || true
          ruff check src/clark --exit-zero --output-format concise > audit-out/ruff.txt 2>&1 || true
          mypy src/clark --ignore-missing-imports > audit-out/mypy.txt 2>&1 || true
          { echo "## Audit (report only)"; for f in pip-audit bandit ruff mypy; do echo "- $f: $(tail -n 1 audit-out/$f.txt | cut -c1-120)"; done; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-reports
          path: audit-out/
          retention-days: 30
