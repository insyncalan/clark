# Run the tests on GitHub's runners (#70: copied from creaite v2.6.11 .github/workflows/tests.yml and adapted; the rules are
# the team repo). Actions › Tests › Run workflow; "files" names test files (space-separated,
# e.g. "test_layout test_milestones") or is left empty for the whole suite; "macos" adds the macOS job.
#
# ===== what runs when =====
# CHEAP PATH (an ordinary pull request): ONE Ubuntu 24.04 job on the newest Python ("3.x"): the pages build, then
# `dev/run_tests.py --push origin/<base>` (the quick tier plus the browser files the change reaches, which is `--changed`
# plus the quick tier). No Python 3.9 and no macOS. The full suite is only for the release gate.
# FULL MATRIX (the `plan` job decides, from the event, the branch and the labels): Ubuntu 3.x with EVERY file and Ubuntu 3.9 on
# the quick tier (`--quick`) on a push to main, on a release branch, on a pull request that changes a guarded file, on the
# label `full-ci`, and by hand. macOS (the newest Python, every file, THREE shards) runs at the RELEASE GATE and on a few other
# events, NOT on a push to main (fewer macOS runs: every merge to main used to start four macOS jobs) and not on
# every push of a guarded pull request: on a release branch (release-X.Y.Z, and the Head's v*-release* line, read from the pull
# request's head branch), on a pull request that changes Mac-specific code (platform.py, updates.py, the launcher and the package
# files), on a pull request that carries the label `full-ci` (adding or removing the label starts a new run; use it only for a
# change that needs a Mac before the release), and by hand (macos=true). A guarded pull request that is not Mac-specific gets the
# full Ubuntu matrix and no macOS until it is on a release branch. macOS is REQUIRED whenever it runs: clark is Mac first. A macOS
# runner that fails to start is re-run once before anyone calls it a failure.
#
# macOS shards: one job with a matrix of three, so `needs.macos.result` is ONE value for the whole matrix (success only if all
# shards pass; skipped when the job's `if` is false). Each runs two test files at a time (JOBS 2): three Chrome tests at once on the
# 3-vCPU, 7 GB runner starved each other, which made the flake. The gate reads that result, so it never depends on a shard's name.
#
# The gate: "Tests passed" is the one result to require. A gate row can be absent because a job with `needs` has no check run
# until its needs finish (so it is missing while a needed job still runs). A stale red gate appeared when concurrency cancelled a
# run while `if: always()` kept the gate running; `if: ${{ !cancelled() }}` posts nothing for a cancelled run.
#
# Safety: `pull_request`, never `pull_request_target` (a fork's code never runs with this repository's token or secrets);
# read-only permissions; no secrets in any job; one run per branch or pull request at a time (a newer run cancels the older);
# every action pinned to a full commit SHA (the tag is in the comment after it); NO paths-ignore: a documents-only change
# still runs the suite, because tests/test_no_real_names.py reads every tracked file, documents included, and the reuse-record
# test reads the reuse record. Skipping the run for a document would let a real name merge unchecked. The suite
# takes seconds, so nothing is saved by skipping it.
#
# Shards (`--shard I/N`, balanced by the real per-file times in dev/tools/shard_times.txt): Ubuntu 3.x has six on the full path and for a pull request that touches a stylesheet or the page, and three on the cheap path otherwise (three took 20 minutes on a full run; six keep the slowest near ten),
# Python 3.9 three (quick tier only; was one shard at 17 to 28 minutes). For Ubuntu (3.x and 3.9): add shards when the slowest job passes 10 minutes.
# macOS SIX (item 1850; was three): the release run 43591747253 on three shards took the whole 60 minutes (two shards cancelled with 306 of 310 and 295 of 311 files done, the third finished at about 58), so six shards carry about half each. Before: three measured 56.5 min with 2 shards (gate run 42092014127), about 38 min expected at 3 (the real macOS shard time was 0.71 of the simulated one),
# with a 60-minute timeout; if the first real gate run exceeds 50 min, move to 4 shards (one line in the matrix). Every test file is in exactly one shard
# (tests/test_run_tests.py proves it).
# `--max-fail 8` stops a shard that has plainly gone wrong after 8 failed files.
on:
  workflow_dispatch:
    inputs:
      files: {description: "Test files to run (empty: all)", required: false, default: ""}
      macos: {description: "Add the macOS job", type: boolean, required: false, default: false}
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]   # labeled/unlabeled: full-ci starts (or stops) the full run
  push:
    branches: [main]
  merge_group:      # GitHub merge queue: the queue tests the combined result; same Ubuntu matrix as a push to main, no macOS (that stays at the release gate)
    types: [checks_requested]

name: Tests
# A hand-started run of named files is named "Tests (files)", so it can be told from a full run.
run-name: ${{ github.event.inputs.files && format('Tests ({0})', github.event.inputs.files) || 'Tests' }}

permissions:
  contents: read

concurrency:
  # One automatic run per pull request or branch. A newer pull request run cancels the older; a main or release push run is
  # never cancelled (it queues). Manual runs each get their own group (run_id), so a second hand-started run never cancels the first.
  group: tests-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # Decides the path once, from text that reaches it only through env: FULL=1 runs the full matrix, MACOS=1 adds macOS. An
    # ordinary pull request gets neither (the cheap path). No checkout, no secrets: seconds.
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read      # the list of changed files, over the API (no checkout of the pull request); this job only
    outputs:
      full: ${{ steps.plan.outputs.full }}
      macos: ${{ steps.plan.outputs.macos }}
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
      py39: ${{ steps.plan.outputs.py39 }}
      shards39: ${{ steps.plan.outputs.shards39 }}
      count39: ${{ steps.plan.outputs.count39 }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          MACOS_INPUT: ${{ github.event.inputs.macos }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          FULL=""; MACOS=""; WIDE=""; NTESTS=0
          case "$EVENT" in
            merge_group) FULL=1 ;;      # a merge-queue run: the same Ubuntu matrix as a push to main, NO macOS
            push) FULL=1 ;;      # a push to main: the full Ubuntu matrix; macOS runs at the release gate, not on every merge
            workflow_dispatch) FULL=1; if [ "$MACOS_INPUT" = "true" ]; then MACOS=1; fi ;;
          esac
          case "$BRANCH" in
            release-*|v*-release*) FULL=1; MACOS=1 ;;
          esac
          # A pull request that TARGETS a release branch is part of the release line too (its base, not only its head branch).
          case "$BASE_REF" in
            release-*|v*-release*) FULL=1; MACOS=1 ;;
          esac
          case ",$LABELS," in
            *,full-ci,*) FULL=1; MACOS=1 ;;
          esac
          # A pull request that changes a guarded file is the full Ubuntu matrix without the label, and macOS only when the file is
          # Mac-specific (platform, updates, the launcher and the package files); the release gate runs macOS on everything else. A file moved away from a guarded path counts too (#593):
          # the API gives the old name as previous_filename, so both names are listed. The changed files come from the API
          # (nothing from the pull request is checked out); if the call fails the answer is full (fail safe). Exact names or
          # anchored prefixes in `case`, never eval. The list is dev/run_tests.py GUARDED plus the publishing, secret-screen,
          # update and platform modules and the workflows.
          if [ "$EVENT" = "pull_request" ] && [ -z "$FULL" ]; then
            if CHANGED="$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')"; then
              # GitHub lists at most 3000 files for a pull request (#601): a list that long may be cut short, so the answer is full (fail safe).
              if [ "$(printf '%s\n' "$CHANGED" | wc -l)" -ge 3000 ]; then FULL=1; MACOS=1; fi
              while IFS= read -r F; do
                case "$F" in
                  src/clark/store.py|src/clark/schema.sql|src/clark/history.py|src/clark/server.py) FULL=1 ;;
                  src/clark/publish.py|src/clark/publish_flow.py|src/clark/secret_screen.py) FULL=1 ;;
                  src/clark/updates.py|src/clark/platform.py) FULL=1; MACOS=1 ;;      # Mac-specific code: tested on a Mac at the pull request
                  clark.command|clark/__main__.py|clark/launch.py|clark/doctor.py|src/clark/launch.py|src/clark/doctor.py|src/clark/release_files.py|dev/tools/package.py) FULL=1; MACOS=1 ;;      # the launcher (clark/launch.py is what clark.command runs) and the package: Mac-specific too
                  .github/*) FULL=1 ;;
                  *.css|src/clark/brand/*|src/clark/page/*|src/clark/templates/*) WIDE=1 ;;      # reaches many test files: keep six shards
                  tests/test_*.py) NTESTS=$((NTESTS + 1)) ;;      # counted below: 8 or more test files is WIDE too
                esac
              done <<< "$CHANGED"
              # A pull request that changes 8 or more tests/test_*.py files is WIDE: six shards, not three. Three shards carry about 6800 s of
              # weighted test time each, and a tests-only bundle (PR 1339) timed out three times at the 30-minute cap on three shards;
              # six shards carry about 3400 s each, which is what a full run takes.
              if [ "$NTESTS" -ge 8 ]; then WIDE=1; fi
            else
              echo "could not list the changed files: full (fail safe)"
              FULL=1; MACOS=1
            fi
          fi
          # The Ubuntu 3.x job runs every file on the full path: four shards (was six, 12-11), each well under its 30-minute cap
          # (one shard hit the cap on PR 440, twice). The cheap path (--push) is sharded the same way: a change to shell.css or another
          # shared file reaches every test file, and as one shard that hit the cap too (PRs 445 and 447). A pull request that reaches few
          # files leaves most shards nearly empty: they finish in the time it takes to set up, and the minutes are free.
          # Python 3.9 (the oldest supported) runs by hand and wherever macOS runs (release line, label full-ci,
          # Mac-specific files), NOT on a push to main (owner's order 08-11: Python 3.9 and macOS only on a release or a Mac-relevant PR); a guarded pull request that is not Mac-specific gets Ubuntu 3.x only (about 12 percent of the Ubuntu minutes).
          PY39=""
          case "$EVENT" in workflow_dispatch) PY39=1 ;; esac
          if [ -n "$MACOS" ]; then PY39=1; fi
          # Ubuntu 3.x shards: four on the full path (every file, see below), six for a pull request that touches a stylesheet or the page (it reaches
          # nearly every test file); THREE on the cheap path otherwise (few files reach: six shards were mostly empty and each one
          # costs a runner slot, a checkout and a setup). Fewer jobs per push means the queue clears sooner (#908 grew it from three).
          # Full path (a guarded change, a push to main, the merge queue): FOUR shards, 12-11 (fewer runner slots, less repeated setup). A WIDE
          # change that is not full (a stylesheet, the page, 8 or more test files) keeps SIX: a tests-only bundle once timed out three
          # times at the 30-minute cap on three shards, and four carry about three quarters of that load. Measure the slowest full-path shard
          # at four before trusting the 15 to 20 minute estimate; if one hits the cap, set COUNT back to 6 here.
          SHARDS='[1,2,3,4,5,6]'; COUNT=6
          if [ -n "$FULL" ]; then SHARDS='[1,2,3,4]'; COUNT=4; fi
          if [ -z "$FULL" ] && [ -z "$WIDE" ]; then SHARDS='[1,2,3]'; COUNT=3; fi
          SHARDS39='[1,2,3]'; COUNT39=3      # Python 3.9, quick tier only (full path)
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "macos=$MACOS" >> "$GITHUB_OUTPUT"
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "py39=$PY39" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "shards39=$SHARDS39" >> "$GITHUB_OUTPUT"
          echo "count39=$COUNT39" >> "$GITHUB_OUTPUT"
          echo "event: $EVENT; branch: $BRANCH; full: ${FULL:-no}; macOS: ${MACOS:-no}; Ubuntu 3.x shards: $COUNT"

  tests:
    # Python "3.x" (the newest) on Ubuntu: the cheap path on an ordinary pull request (--push origin/<base>), every file when
    # the plan says full.
    name: ubuntu-24.04 · Python 3.x · shard ${{ matrix.shard }}/${{ needs.plan.outputs.count }}      # the gate reads needs.tests.result (one value for the whole matrix), never this name
    needs: plan
    runs-on: ubuntu-24.04      # not ubuntu-latest: it became 26.04 on 21-10-2026, which has no Python 3.9 (the oldest supported)
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # A pull request needs the whole history so the base branch is there for --push to diff against.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Find Chrome
        # The browser tests find Chrome through dev/tools/run_support.py chrome_path(): CLARK_CHROME, then the PATH, then macOS.
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          MAC="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ -z "$CHROME" ] && [ -x "$MAC" ]; then CHROME="$MAC"; fi
          test -n "$CHROME" || { echo "No Chrome on this runner"; exit 1; }
          echo "CLARK_CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          python3 --version

      - name: Build the pages
        # The generated pages are not committed (#495). Built from the sources in this checkout with the pinned esbuild
        # (fetched and checked against its SHA-256 by dev/tools/esbuild.py); a failed fetch or build fails the job.
        run: python3 dev/tools/build_page.py

      - name: Tests
        env:
          FILES: ${{ github.event.inputs.files }}
          JOBS: 4
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.plan.outputs.count }}
          FULL: ${{ needs.plan.outputs.full }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          # Branch and base names are untrusted text: they reach this shell only through env, never interpolated into it.
          SCOPE=""
          if [ "$EVENT" = "pull_request" ] && [ -z "$FULL" ]; then SCOPE="--push origin/$BASE"; fi
          python3 dev/run_tests.py -j "$JOBS" $SCOPE --shard "$SHARD/$SHARDS" --max-fail 8 $FILES

  tests-py39:
    # Python 3.9 (the oldest clark supports) on the quick tier (`--quick`: the files that never start Chrome). Only where the plan wants it (py39=1: by hand, release line, label full-ci, Mac-specific files).
    if: ${{ needs.plan.outputs.full == '1' && needs.plan.outputs.py39 == '1' }}
    name: ubuntu-24.04 · Python 3.9 · shard ${{ matrix.shard }}/${{ needs.plan.outputs.count39 }}      # the gate reads needs.tests-py39.result (one value for the whole matrix), never this name
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards39) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"

      - name: Find Chrome
        # The browser tests find Chrome through dev/tools/run_support.py chrome_path(): CLARK_CHROME, then the PATH, then macOS.
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          MAC="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ -z "$CHROME" ] && [ -x "$MAC" ]; then CHROME="$MAC"; fi
          test -n "$CHROME" || { echo "No Chrome on this runner"; exit 1; }
          echo "CLARK_CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          python3 --version

      - name: Build the pages
        # The generated pages are not committed (#495). Built from the sources in this checkout with the pinned esbuild
        # (fetched and checked against its SHA-256 by dev/tools/esbuild.py); a failed fetch or build fails the job.
        run: python3 dev/tools/build_page.py

      - name: Tests
        env:
          FILES: ${{ github.event.inputs.files }}
          JOBS: 4
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.plan.outputs.count39 }}
        run: python3 dev/run_tests.py -j "$JOBS" --quick --shard "$SHARD/$SHARDS" --max-fail 8 $FILES

  macos:
    # macOS (the newest Python, every file, three shards) when the plan says so: a release branch, a pull request
    # that changes Mac-specific code, the full-ci label, or a hand-started run with macos=true (gh workflow run Tests --ref <branch> -f macos=true). Required when it runs.
    if: ${{ needs.plan.outputs.macos == '1' }}
    name: macos-latest · Python 3.x · shard ${{ matrix.shard }}/${{ matrix.shards }}      # skipped: shown unresolved; the gate reads needs.macos.result, never this name
    needs: plan
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: 1, shards: 6}
          - {shard: 2, shards: 6}
          - {shard: 3, shards: 6}
          - {shard: 4, shards: 6}
          - {shard: 5, shards: 6}
          - {shard: 6, shards: 6}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Find Chrome
        # The browser tests find Chrome through dev/tools/run_support.py chrome_path(): CLARK_CHROME, then the PATH, then macOS.
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          MAC="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ -z "$CHROME" ] && [ -x "$MAC" ]; then CHROME="$MAC"; fi
          test -n "$CHROME" || { echo "No Chrome on this runner"; exit 1; }
          echo "CLARK_CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          python3 --version

      - name: Build the pages
        # The generated pages are not committed (#495). Built from the sources in this checkout with the pinned esbuild
        # (fetched and checked against its SHA-256 by dev/tools/esbuild.py); a failed fetch or build fails the job.
        run: python3 dev/tools/build_page.py

      - name: Tests
        env:
          FILES: ${{ github.event.inputs.files }}
          JOBS: 2
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: python3 dev/run_tests.py -j "$JOBS" --shard "$SHARD/$SHARDS" --max-fail 8 $FILES

  passed:
    # The one result to wait for (and to require): green only if every required job is. The plan and the 3.x job must pass.
    # Python 3.9 must pass when the plan wants it (WANT_PY39) and must have been skipped when it doesn't; the same for macOS
    # with its own flag. So a FAILED or cancelled required job fails the gate, and a job skipped by the cheap path does not.
    # (A cancelled run posts no gate at all, see the header.)
    name: Tests passed
    needs: [plan, tests, tests-py39, macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          TESTS: ${{ needs.tests.result }}
          PY39: ${{ needs.tests-py39.result }}
          MACOS: ${{ needs.macos.result }}
          WANT_PY39: ${{ needs.plan.outputs.py39 }}
          WANT_MACOS: ${{ needs.plan.outputs.macos }}
        run: |
          echo "plan: $PLAN; Linux 3.x: $TESTS; Linux 3.9: $PY39 (required: ${WANT_PY39:-no}); macOS: $MACOS (required: ${WANT_MACOS:-no})"
          test "$PLAN" = "success"
          test "$TESTS" = "success"
          if [ -n "$WANT_PY39" ]; then test "$PY39" = "success"; else test "$PY39" = "skipped"; fi
          if [ -n "$WANT_MACOS" ]; then test "$MACOS" = "success"; else test "$MACOS" = "skipped"; fi
